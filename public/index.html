<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0444ff"><meta name="description" content="A personal contact card"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><title>Digital card</title></head><body><main class="card-shell"><header class="topline"><span class="brand-mark">B</span><span class="domain-label">BIO · DIGITAL CARD</span><button class="icon-button" id="share" aria-label="Share card">↗</button></header><section class="profile"><div id="avatar" class="avatar">A</div><p class="eyebrow" id="company"></p><h1 id="name">Loading…</h1><p class="role" id="title"></p><p class="bio" id="bio"></p><div class="actions"><a class="primary-button" id="save" href="/card.vcf">Save contact <span>↓</span></a><a class="secondary-button" id="whatsapp" hidden target="_blank" rel="noopener">WhatsApp <span>↗</span></a></div></section><nav class="contact-list" id="contacts"></nav><div class="exchange-wrap" id="exchange-wrap"><button class="exchange-button" id="exchange-open">Exchange contact details <span>＋</span></button></div><section class="qr-area"><div id="qr" class="qr"><img alt="QR code linking to this card"></div><p>Scan to open my card</p></section><footer>Carry a little connection with you <span>✳</span></footer></main><dialog id="exchange-dialog"><form id="exchange-form"><button class="close" type="button" aria-label="Close">×</button><span class="eyebrow">LET’S STAY IN TOUCH</span><h2>Exchange details</h2><p class="hint">Your details will be shared with the card owner.</p><label>Your name<input name="name" required autocomplete="name" maxlength="100" placeholder="Full name"></label><label>Email<input name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com"></label><label>Phone <span class="hint">(optional if you add email)</span><input name="phone" autocomplete="tel" maxlength="40" placeholder="Phone number"></label><label>Message <span class="hint">(optional)</span><textarea name="message" maxlength="500" placeholder="It was great meeting you"></textarea></label><label class="consent"><input type="checkbox" name="consent" required><span>I agree to share these details with the card owner so they can follow up.</span></label><button class="primary-button submit" type="submit">Send my details <span>→</span></button><p id="form-message" class="form-message" aria-live="polite"></p></form></dialog><script src="/app.js" defer></script></body></html>
